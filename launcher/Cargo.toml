[package]
name = "launcher"
version = "1.6.16"
edition = "2024"

[dependencies]
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["all_loaders"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
