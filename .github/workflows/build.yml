name: Build Cross-Platform Launchers

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Launcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev

      - name: Build Linux Launcher (Release)
        working-directory: launcher
        run: cargo build --release

      - name: Prepare binary
        run: |
          cp launcher/target/release/launcher ./gow3-launcher
          chmod +x ./gow3-launcher

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gow3-launcher-linux
          path: ./gow3-launcher

  build-windows:
    name: Build Windows Launcher
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Launcher (Release)
        working-directory: launcher
        run: cargo build --release

      - name: Prepare binary
        run: |
          Copy-Item launcher/target/release/launcher.exe -Destination ./gow3-launcher.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gow3-launcher-windows
          path: ./gow3-launcher.exe

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: gow3-launcher-linux
          path: ./artifacts/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: gow3-launcher-windows
          path: ./artifacts/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "God of War III Native Launcher (Latest Build)"
          body: |
            ## 🚀 God of War III Remastered - Native Launcher (Linux & Windows)

            Otomatik olarak derlenmiş en son sürümler:
            - **Linux**: `gow3-launcher`
            - **Windows**: `gow3-launcher.exe`

            ### ✨ Özellikler
            - Modern animasyonlu kayan düğmeler (Switch UI)
            - Kararlı 60 FPS / 120 FPS / 144 FPS / 240 FPS desteği
            - Sinematikleri kumandanın **X** tuşuyla anında geçme yaması (Açılıp kapatılabilir)
            - Sarı doku bozulmasını önleme yaması (Instant readbacks)
            - Dahili otomatik donanım ve monitör Hz optimizasyonu
            - 4 farklı dil desteği (Türkçe, English, Deutsch, Español)
            - Otomatik self-updater ve GitHub eşitlemesi
          files: |
            ./artifacts/gow3-launcher
            ./artifacts/gow3-launcher.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
