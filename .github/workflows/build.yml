name: Build Cross-Platform Launchers

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Launcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev

      - name: Build Linux Launcher (Release)
        working-directory: launcher
        run: cargo build --release

      - name: Prepare binary
        run: |
          cp launcher/target/release/launcher ./gow3-launcher
          chmod +x ./gow3-launcher

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gow3-launcher-linux
          path: ./gow3-launcher

  build-windows:
    name: Build Windows Launcher
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Launcher (Release)
        working-directory: launcher
        run: cargo build --release

      - name: Prepare binary
        run: |
          Copy-Item launcher/target/release/launcher.exe -Destination ./gow3-launcher-win.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gow3-launcher-windows
          path: ./gow3-launcher-win.exe

  publish-release:
    name: Publish Release & Sync Windows Binary
    needs: [build-linux, build-windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: gow3-launcher-linux
          path: ./artifacts/

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: gow3-launcher-windows
          path: ./artifacts/

      - name: Commit Windows launcher to repo root
        run: |
          cp ./artifacts/gow3-launcher-win.exe ./gow3-launcher-win.exe
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gow3-launcher-win.exe
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(build): sync gow3-launcher-win.exe to repo root [skip ci]" && git push origin main)

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "God of War III Native Launcher (Dual-Boot & Cross-Platform)"
          body: |
            ## 🚀 God of War III Remastered - Native Launcher (Linux & Windows)

            Aynı klasörde yan yana çalışabilen yerel ikili dosyalar:
            - 🐧 **Linux**: `gow3-launcher`
            - 🪟 **Windows / Dual-Boot**: `gow3-launcher-win.exe`

            ### ✨ Özellikler
            - **Dual-Boot Desteği:** Aynı klasörde hem Windows hem Linux için yan yana bağımsız launcher'lar!
            - **Modern Kayan Anahtarlar:** Klasik kutucuklar yerine animasyonlu Switch teması
            - **Kararlı 60 FPS / 120 FPS / 144 FPS / 240 FPS Pacing:** Fizik hızlanma sorunu olmadan akıcı oynanış
            - **Sinematikleri 'X' Tuşuyla Atlama Yaması:** Ara sahneleri kumandanızın X tuşuyla geçebilme seçeneği
            - **Sarı Doku Hatası Önleme Yaması (Instant Readbacks):** Karlı ve parlak sahnelerdeki renk bozulmasını engeller
            - **Dahili Donanım ve Ekran Hz Tespiti:** GPU, VRAM, RAM ve ekran yenileme hızına göre otomatik yapılandırma
            - **4 Farklı Dil Desteği:** Türkçe 🇹🇷, English 🇬🇧, Deutsch 🇩🇪, Español 🇪🇸
            - **%100 Rust Uyumlu Self-Updater:** Doğrudan GitHub üzerinden en son sürüme tek tıkla güncelleme
          files: |
            ./artifacts/gow3-launcher
            ./artifacts/gow3-launcher-win.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
